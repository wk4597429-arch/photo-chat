<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한밭대사진관 챗봇</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --paper:#F6F1E7;
  --paper-2:#EFE7D6;
  --ink:#211D1A;
  --ink-soft:#5B5449;
  --forest:#2F4C39;
  --mustard:#D9A61A;
  --rust:#A8461B;
  --line:#D9CEB6;
  --white:#FFFDF8;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  font-family:'Work Sans', sans-serif;
  color:var(--ink);
  display:flex;
  justify-content:center;
  min-height:100vh;
}
.app{
  width:100%;
  max-width:760px;
  display:flex;
  flex-direction:column;
  min-height:100vh;
  background:var(--paper);
  position:relative;
}

/* sprocket strip */
.sprockets{
  display:flex;
  gap:14px;
  padding:8px 20px;
  overflow:hidden;
}
.sprockets span{
  width:9px;height:9px;border-radius:2px;
  background:var(--ink);
  opacity:0.55;
  flex:none;
}
.sprockets.bottom{margin-top:auto;}

header{
  padding:6px 28px 20px 28px;
  border-bottom:1px solid var(--line);
}
.eyebrow{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--rust);
  margin:0 0 6px 0;
}
h1{
  font-family:'Fraunces', serif;
  font-optical-sizing:auto;
  font-weight:600;
  font-size:34px;
  line-height:1.05;
  margin:0 0 8px 0;
  letter-spacing:-0.01em;
}
.tagline{
  font-size:14.5px;
  color:var(--ink-soft);
  margin:0 0 14px 0;
}
.infobar{
  display:flex;
  flex-wrap:wrap;
  gap:8px 18px;
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  color:var(--forest);
}
.infobar span{white-space:nowrap;}

/* category strip */
.cats{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:14px 28px;
  border-bottom:1px solid var(--line);
  scrollbar-width:thin;
}
.cats::-webkit-scrollbar{height:5px;}
.cats::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
.cat-chip{
  flex:none;
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  padding:7px 12px;
  border:1px solid var(--ink);
  border-radius:2px;
  background:var(--white);
  color:var(--ink);
  cursor:pointer;
  white-space:nowrap;
  transition:background .15s, color .15s;
}
.cat-chip:hover{background:var(--ink);color:var(--paper);}
.cat-chip.active{background:var(--forest);color:var(--white);border-color:var(--forest);}

/* quick questions */
.quickwrap{
  padding:0 28px;
  border-bottom:1px solid var(--line);
  max-height:0;
  overflow:hidden;
  transition:max-height .25s ease, padding .25s ease;
}
.quickwrap.open{
  max-height:220px;
  padding:14px 28px;
  overflow-y:auto;
}
.quick-title{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  color:var(--ink-soft);
  margin:0 0 8px 0;
}
.quick-q{
  display:block;
  width:100%;
  text-align:left;
  background:none;
  border:none;
  border-bottom:1px dashed var(--line);
  padding:8px 2px;
  font-family:'Work Sans', sans-serif;
  font-size:13.5px;
  color:var(--ink);
  cursor:pointer;
}
.quick-q:hover{color:var(--rust);}

/* chat */
.chat{
  flex:1;
  padding:24px 28px;
  display:flex;
  flex-direction:column;
  gap:16px;
  overflow-y:auto;
}
.msg{max-width:84%;}
.msg.user{align-self:flex-end;}
.msg.bot{align-self:flex-start;}
.bubble-user{
  background:var(--ink);
  color:var(--paper);
  padding:11px 15px;
  border-radius:3px;
  font-size:14.5px;
  line-height:1.5;
  white-space:pre-wrap;
}
.frame{
  background:var(--white);
  border:1px solid var(--ink);
  border-radius:2px;
  padding:14px 16px 14px 16px;
  position:relative;
}
.frame::before{
  content:attr(data-no);
  position:absolute;
  top:-9px;
  left:12px;
  background:var(--mustard);
  color:var(--ink);
  font-family:'IBM Plex Mono', monospace;
  font-size:10px;
  padding:1px 6px;
  border-radius:2px;
  letter-spacing:.05em;
}
.frame-cat{
  font-family:'IBM Plex Mono', monospace;
  font-size:10.5px;
  color:var(--forest);
  margin:4px 0 6px 0;
  text-transform:uppercase;
  letter-spacing:.05em;
}
.frame-body{
  font-size:14.5px;
  line-height:1.55;
  white-space:pre-wrap;
}
.frame-note{
  margin-top:10px;
  padding-top:8px;
  border-top:1px dashed var(--line);
  font-size:12.5px;
  color:var(--rust);
  line-height:1.5;
}
.suggest-row{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:10px;
}
.suggest-chip{
  font-family:'IBM Plex Mono', monospace;
  font-size:11.5px;
  padding:5px 10px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--paper-2);
  cursor:pointer;
  color:var(--ink-soft);
}
.suggest-chip:hover{border-color:var(--ink); color:var(--ink);}

.typing{
  display:flex;
  gap:4px;
  padding:6px 2px;
}
.typing span{
  width:6px;height:6px;border-radius:50%;
  background:var(--ink-soft);
  animation:blink 1.1s infinite ease-in-out;
}
.typing span:nth-child(2){animation-delay:.15s;}
.typing span:nth-child(3){animation-delay:.3s;}
@keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}

/* input */
.inputbar{
  display:flex;
  gap:10px;
  padding:16px 28px;
  border-top:1px solid var(--line);
  background:var(--paper);
}
.inputbar input{
  flex:1;
  border:1px solid var(--ink);
  border-radius:2px;
  padding:11px 13px;
  font-family:'Work Sans', sans-serif;
  font-size:14.5px;
  background:var(--white);
  color:var(--ink);
}
.inputbar input:focus{outline:2px solid var(--mustard); outline-offset:1px;}
.inputbar button{
  border:none;
  background:var(--rust);
  color:var(--white);
  font-family:'IBM Plex Mono', monospace;
  font-size:13px;
  padding:0 20px;
  border-radius:2px;
  cursor:pointer;
  letter-spacing:.03em;
}
.inputbar button:hover{background:var(--forest);}
.inputbar button:focus-visible, .cat-chip:focus-visible, .quick-q:focus-visible, .suggest-chip:focus-visible{
  outline:2px solid var(--mustard);
  outline-offset:1px;
}

footer{
  padding:10px 28px 4px 28px;
  font-family:'IBM Plex Mono', monospace;
  font-size:10.5px;
  color:var(--ink-soft);
  text-align:center;
}

@media (prefers-reduced-motion: reduce){
  .typing span{animation:none; opacity:1;}
  .quickwrap{transition:none;}
}

@media (max-width:480px){
  h1{font-size:27px;}
  header{padding:6px 18px 16px 18px;}
  .cats,.quickwrap,.chat,.inputbar,footer{padding-left:18px;padding-right:18px;}
  .msg{max-width:92%;}
}
</style>
</head>
<body>
<div class="app">

  <header>

</div>

<script>
const FAQ = [{"category": "인사말", "question": "시작하기 / 안녕하세요 / 안녕 / 처음 / 문의하고 싶어요", "answer": "안녕하세요! 한밭대사진관입니다 😊\n인물사진·여권사진·운전면허사진 전문점이에요.\n무엇을 도와드릴까요?\n\n1️⃣ 촬영 종류 안내\n2️⃣ 가격 안내\n3️⃣ 영업시간·위치\n4️⃣ 예약 문의\n5️⃣ 전화 상담 연결", "group": "상담·문의"}, {"category": "위치", "question": "위치가 어디예요? / 주소 알려주세요 / 어디에 있어요? / 찾아가는 길 / 오시는 길", "answer": "📍 대전광역시 유성구 동서대로 125\n한밭대학교 S2동 학생회관 1층에 위치해 있습니다.\n\n네이버지도·카카오맵에서 '한밭대사진관' 검색하시면 바로 찾으실 수 있어요! (정문 통과 후 우회전 주차장 이용 시 편리해요)", "group": "영업정보"}, {"category": "위치-찾아오는법", "question": "버스 타고 어떻게 가요? / 지하철로 가는 법 / 대중교통", "answer": "대중교통 이용 방법을 알려주세요.102,104,113,117,\n예: 대전역에서 반석행 지하철 탑승 → 현충원역 하차 → 3번 출구 → 한밭대 셔틀버스 또는 도보 이동", "group": "영업정보"}, {"category": "위치-외부인출입", "question": "외부인도 사진관 이용할 수 있나요? / 학생이 아닌데 가도 되나요?", "answer": "네, 누구나 이용 가능합니다! 대학교 안에 있지만 일반 손님도 자유롭게 방문하실 수 있어요 😊", "group": "영업정보"}, {"category": "영업시간", "question": "영업시간이 어떻게 되나요? / 몇시에 열어요? / 몇시까지 해요? / 오늘 영업하나요?", "answer": "🕘 평일(월~금) 09:30 ~ 19:00\n🕥 토·일요일 11:00 ~ 18:00\n※ 법정 공휴일도 영업하나, 사정에 따라 유동적으로 운영될 수 있어요. 방문 전 전화로 한 번 더 확인해주시면 더 정확해요!", "group": "영업정보"}, {"category": "영업시간-점심", "question": "점심시간에도 영업해요? / 브레이크타임 있나요?", "answer": "점심시간(브레이크타임) 없이 계속 영업합니다. 영업시간 내 언제든 편하신 시간에 방문해주시면 돼요 :)", "group": "영업정보"}, {"category": "영업시간-명절", "question": "설날/추석에도 영업해요? / 공휴일에 문 열어요?", "answer": "법정 공휴일에는 영업하는 편이나, 개인 사정에 따라 유동적으로 운영될 수 있어요. 방문 전 공지사항을 확인하시거나 전화로 문의해주세요!", "group": "영업정보"}, {"category": "영업시간-방학중", "question": "방학 때도 영업하나요? / 방학 기간 영업시간 다른가요?", "answer": " 방학 기간 중 영업시간 변경 여부를 알려주세요.", "group": "영업정보"}, {"category": "연락처", "question": "전화번호 알려주세요 / 예약 전화 / 연락처가 어떻게 되나요? / 전화하고 싶어요", "answer": "📞 전화 문의: 0507-1320-1427\n영업시간 내 연락 부탁드립니다 :)", "group": "상담·문의"}, {"category": "촬영종류-전체", "question": "어떤 사진 찍을 수 있어요? / 촬영 종류 / 뭐 찍을 수 있어요? / 촬영 메뉴", "answer": "저희 사진관 주요 촬영 종류는 아래와 같습니다 📸\n\n· 증명사진 (주민등록증/운전면허/여권)\n· 취업·면접 사진\n· 학위복·졸업 사진\n· 컬러 프로필\n· 우정·커플 이미지 사진\n· 단체사진 / 가족사진\n\n원하시는 촬영 종류를 말씀해주시면 자세히 안내해드릴게요!", "group": "촬영종류·서류사진"}, {"category": "여권사진-기본", "question": "여권사진 찍을 수 있나요? / 여권사진 규격 / 여권사진 찍고 싶어요", "answer": "네, 여권사진 촬영 전문으로 하고 있어요!\n외교부 규격(흰 배경, 가로 3.5cm x 세로 4.5cm)에 맞춰 정확하게 촬영해드립니다.\n※ 흰색 배경이므로 흰옷은 피해주세요. 양쪽 눈썹과 얼굴 윤곽이 잘 보여야 하고, 컬러렌즈나 짙은 장신구는 착용이 어려워요.", "group": "촬영종류·서류사진"}, {"category": "여권사진-갱신", "question": "여권 갱신할 때도 새로 찍어야 하나요? / 여권 재발급 사진", "answer": "네, 여권 갱신·재발급 시에는 최근 6개월 이내 촬영한 사진이 필요해요. 저희 사진관에서 규격에 맞게 촬영해드릴게요.", "group": "촬영종류·서류사진"}, {"category": "여권사진-어린이", "question": "아기 여권사진도 찍을 수 있나요? / 영유아 여권사진", "answer": " 영유아·어린이 여권사진 촬영 가능 여부와 유의사항(눈 뜨고 정면 응시 등)을 알려주세요.", "group": "촬영종류·서류사진"}, {"category": "비자사진-미국", "question": "미국 비자사진도 찍어주나요? / 미국비자 규격사진", "answer": " 미국 비자사진(51x51mm, 특정 배경색 등) 규격 촬영 가능 여부를 알려주세요.", "group": "촬영종류·서류사진"}, {"category": "비자사진-중국일본", "question": "중국/일본 비자사진 규격도 가능해요?", "answer": "중국·일본 등 국가별 비자사진 규격 대응 가능 여부를 알려주세요.", "group": "촬영종류·서류사진"}, {"category": "비자사진-기타국가", "question": "다른 나라 비자사진도 찍을 수 있나요?", "answer": "네, 국가별 비자사진 규격이 다양한데 방문하실 때 어느 국가인지 말씀해주시면 그에 맞게 촬영해드려요.\n[입력 필요] 주요 대응 가능 국가 리스트가 있다면 알려주세요.", "group": "촬영종류·서류사진"}, {"category": "운전면허사진-기본", "question": "운전면허사진 찍을 수 있나요? / 운전면허증 사진 규격", "answer": "네, 운전면허사진 촬영 전문으로 하고 있어요!\n규격(가로3.5cm x 세로4.5cm, 흰 배경)에 맞춰 촬영해드립니다.\n5~20분소요시간과 파일/인화 제공 방식을 알려주세요.파일3,000원", "group": "촬영종류·서류사진"}, {"category": "운전면허사진-갱신", "question": "운전면허 갱신할 때 사진 새로 찍어야 하나요? / 면허 갱신 주기", "answer": "네, 운전면허 갱신 시 최근 촬영한 사진이 필요해요. 갱신 주기는 면허 종류에 따라 다르니 정확한 시기는 도로교통공단이나 경찰서에 확인해보시는 걸 추천드려요.\n저희는 규격에 맞는 촬영을 도와드릴게요!", "group": "촬영종류·서류사진"}, {"category": "운전면허사진-1종2종", "question": "1종/2종 면허 사진 규격이 달라요?", "answer": "1종·2종 모두 동일한 규격(3x4cm)으로 촬영 가능합니다. 시험장이나 발급기관에 제출할 사진을 정확히 맞춰드려요.", "group": "촬영종류·서류사진"}, {"category": "운전면허사진-안경", "question": "안경 쓰고 찍어도 되나요? / 안경 벗어야 하나요?", "answer": "안경을 착용하고 촬영하실 수 있어요! 다만 조명 반사나 눈가 그늘이 생길 수 있어, 안경테가 많이 두껍거나 색이 들어간 렌즈는 촬영에 제한이 있을 수 있어요.", "group": "촬영종류·서류사진"}, {"category": "인물사진-프로필기본", "question": "인물사진 찍고 싶어요 / 프로필사진 문의", "answer": "인물사진(프로필) 촬영이 가능합니다.\n제출 용도(제출용/소장용/강사 프로필 등)에 따라 촬영 방식과 보정 컷 수가 달라져요. 자세한 구성은 가격표를 참고해주세요!", "group": "촬영종류·서류사진"}, {"category": "인물사진-포트폴리오", "question": "배우/모델 포트폴리오용 사진도 찍어요?", "answer": " 포트폴리오용 인물사진(다양한 포즈·컨셉 촬영) 가능 합니다.", "group": "촬영종류·서류사진"}, {"category": "인물사진-소개팅", "question": "소개팅/결혼정보회사 제출용 사진 찍을 수 있나요?", "answer": "소개팅·결혼정보회사 제출용 인물사진 촬영 가능 여부와 특징(자연스러운 느낌 강조 등)가능 합니다.", "group": "촬영종류·서류사진"}, {"category": "인물사진-시니어", "question": "부모님 환갑/칠순 기념사진 찍을 수 있나요? / 어르신 사진", "answer": "[입력 필요] 시니어(어르신) 인물사진, 환갑·칠순 기념사진 촬영 가능 합니다.", "group": "촬영종류·서류사진"}, {"category": "인물사진-이력서", "question": "이력서용 사진 찍고 싶어요 / 취업사진", "answer": "이력서·취업용 사진 촬영이 가능합니다.\n정밀 보정과 메이크업·의상 디지털 수정이 포함된 '취업 사진 패키지'가 준비되어 있어요! (실물 의상은 포토샵으로 디지털 합성돼요)", "group": "촬영종류·서류사진"}, {"category": "인물사진-화장/헤어규정", "question": "화장 진하게 하고 가도 되나요? / 헤어스타일 제한 있나요?", "answer": "피부 잡티 제거, 비대칭 교정, 윤곽 수정 등 자연스러우면서도 깔끔한 보정을 원칙으로 해요. 과도한 보정을 원치 않으시면 촬영 전 미리 말씀해주세요!", "group": "의상·준비물"}, {"category": "촬영종류-증명", "question": "증명사진 찍고 싶어요 / 증명사진 촬영 문의", "answer": "네! 증명사진 촬영 가능합니다.\n고객님의 퍼스널 컬러나 원하시는 분위기에 맞춰 배경색을 직접 선택하실 수 있는 컬러 증명사진 서비스도 제공하고 있어요.", "group": "촬영종류·서류사진"}, {"category": "증명사진-주민등록증", "question": "주민등록증 재발급용 사진 찍을 수 있나요?", "answer": "주민등록증 재발급용 규격사진 촬영 가능 합니다.", "group": "촬영종류·서류사진"}, {"category": "증명사진-사원증", "question": "사원증/출입증 사진 찍을 수 있나요?", "answer": "사원증·출입증용 규격사진 촬영 가능 합니다.", "group": "촬영종류·서류사진"}, {"category": "증명사진-자격증", "question": "자격증 시험 응시원서 사진 찍을 수 있나요?", "answer": "각종 자격증·시험 응시원서용 규격사진 촬영 가능 합니다.", "group": "촬영종류·서류사진"}, {"category": "증명사진-복지카드", "question": "장애인등록증/복지카드 사진 찍을 수 있나요?", "answer": "장애인등록증 등 복지 관련 서류용 사진 촬영 가능 합니다.", "group": "촬영종류·서류사진"}, {"category": "증명사진-보험서류", "question": "실비보험 서류에 넣을 사진도 찍어주나요?", "answer": " 보험·행정서류 제출용 증명사진 촬영 가능 합니다.", "group": "촬영종류·서류사진"}, {"category": "증명사진-노인장기요양", "question": "노인장기요양보험 등급 신청용 사진 찍을 수 있나요?", "answer": "[입력 필요] 노인장기요양보험 등 서류용 사진 촬영 가능 여부를 알려주세요.", "group": "촬영종류·서류사진"}, {"category": "촬영종류-가족", "question": "가족사진 촬영하고 싶어요 / 가족사진 몇 명까지 가능해요?", "answer": "가족사진 촬영 가능합니다!\n최대 20명까지 촬영 가능한 공간이 마련되어 있고, 인원수와 구성에 따라 맞춤 원수에 따라 할인 혜택도 적용해드리니 별도 문의 부탁드려요 :)", "group": "촬영종류·서류사진"}, {"category": "외국인유학생", "question": "외국인 학생도 여권사진 찍을 수 있나요? / 영어로 안내되나요?", "answer": "[입력 필요] 외국인 유학생 응대(영어 안내 가능 여부 등)를 알려주세요.", "group": "사진관소개"}, {"category": "인화만-폰사진", "question": "폰에 있는 사진만 인화해줄 수 있나요?", "answer": "[입력 필요] 휴대폰·디지털 파일 인화만 가능한지, 비용은 얼마인지 알려주세요.", "group": "보정·인화·수령"}, {"category": "인화사이즈", "question": "인화 사이즈는 어떤 게 있나요? / 큰 사이즈로도 인화되나요?", "answer": "[입력 필요] 제공 가능한 인화 사이즈(3x4, 반명함, 4x6, 5x7 등)를 알려주세요.", "group": "보정·인화·수령"}, {"category": "스캔서비스", "question": "오래된 사진 스캔해줄 수 있나요? / 필름사진 디지털화", "answer": "[입력 필요] 사진 스캔·디지털화 서비스 제공 여부를 알려주세요.", "group": "보정·인화·수령"}, {"category": "사진복원", "question": "낡고 오래된 사진 복원도 되나요?", "answer": "[입력 필요] 오래된 사진 복원(색보정, 손상 복구 등) 서비스 제공 여부를 알려주세요.", "group": "기타"}, {"category": "USB/파일제공", "question": "사진을 USB로 받을 수 있나요? / 파일로 저장해주나요?", "answer": "[입력 필요] USB 저장, 이메일·문자 파일 전송 등 파일 제공 방식을 알려주세요.", "group": "보정·인화·수령"}, {"category": "가격-여권", "question": "여권사진 가격 알려주세요 / 여권사진 얼마예요?", "answer": "여권사진 가격: 10,000원 (1:1 맞춤 보정 + 인화 6장 포함)", "group": "가격·결제·이벤트"}, {"category": "가격-운전면허", "question": "운전면허사진 가격은요? / 운전면허사진 얼마예요?", "answer": "운전면허사진 가격: 10,000원 (1:1 맞춤 보정 + 인화 6장 포함, 증명·여권사진과 동일 기준으로 추정)", "group": "가격·결제·이벤트"}, {"category": "가격-증명", "question": "증명사진 가격이 얼마예요? / 증명사진 얼마예요?", "answer": "증명사진 가격: 10,000원 (1:1 맞춤 보정 + 인화 6장 포함)", "group": "가격·결제·이벤트"}, {"category": "가격-인물/프로필", "question": "프로필사진 가격이 궁금해요 / 프로필 얼마예요? / 인물사진 얼마예요?", "answer": "[입력 필요] 인물(프로필)사진 가격: 000원", "group": "가격·결제·이벤트"}, {"category": "가격-가족", "question": "가족사진 촬영 비용은요? / 가족사진 가격표", "answer": "[입력 필요] 가족사진 촬영 비용: 000원부터\n(인원수/앨범 종류에 따라 상이하면 표로 알려주세요)", "group": "가격·결제·이벤트"}, {"category": "가격-졸업사진", "question": "졸업사진 가격은요?", "answer": "[입력 필요] 졸업사진 가격: 000원", "group": "학위복·졸업"}, {"category": "가격-추가보정", "question": "보정 추가하면 얼마 더 내야 해요? / 추가 인화 비용", "answer": "[입력 필요] 추가 보정·추가 인화 시 비용 정책을 알려주세요.", "group": "가격·결제·이벤트"}, {"category": "가격-액자/상품", "question": "액자 씌워주나요? / 액자 가격은요? / 앨범 추가 비용", "answer": "[입력 필요] 액자·앨범 등 추가 상품 구성 및 가격을 알려주세요.", "group": "가격·결제·이벤트"}, {"category": "가격-여러장할인", "question": "여러 장 찍으면 할인되나요? / 다수 인화 할인", "answer": "[입력 필요] 다량 촬영·인화 시 할인 정책을 알려주세요.", "group": "가격·결제·이벤트"}, {"category": "결제", "question": "카드 결제 되나요? / 현금만 받나요? / 계좌이체 가능해요? / 카카오페이 되나요?", "answer": "신용카드, 체크카드, 삼성페이, 계좌이체, 현금 모두 결제 가능합니다! 대전지역사랑상품권(카드)도 사용하실 수 있어요.\n다만 제로페이·네이버페이는 아쉽게도 지원하지 않으니 참고 부탁드려요.", "group": "가격·결제·이벤트"}, {"category": "결제-현금영수증", "question": "현금영수증 발행되나요? / 세금계산서 발행 가능한가요?", "answer": "[입력 필요] 현금영수증·세금계산서 발행 가능 여부를 알려주세요.", "group": "가격·결제·이벤트"}, {"category": "예약방법", "question": "예약은 어떻게 하나요? / 예약하고 싶어요 / 촬영 예약", "answer": "일반 증명·여권사진은 예약 없이 방문하셔도 촬영 가능해요!\n다만 취업사진, 프로필, 이미지 사진, 학위복 촬영, 단체사진, 가족사진은 대기시간을 줄이기 위해 네이버예약·카카오예약 또는 전화로 사전 예약을 추천드려요. 당일 예약도 스케줄에 여유가 있으면 가능하니 잔여 타임을 문의해주세요!", "group": "예약·방문"}, {"category": "예약-변경/취소", "question": "예약 취소하고 싶어요 / 예약 시간 변경하고 싶어요", "answer": "예약 변경 및 취소는 최소 방문 하루 전까지 네이버예약·카카오예약 또는 전화로 직접 요청해주시면 감사하겠습니다!", "group": "예약·방문"}, {"category": "당일방문", "question": "예약 없이 바로 방문해도 되나요? / 워크인 가능해요? / 당일 촬영 되나요?", "answer": "네, 일반 증명·여권사진은 예약 없이 바로 방문(워크인)하셔도 촬영 가능해요! 취업사진 등 다른 촬영도 당일 스케줄에 여유가 있으면 가능하니 방문 전 전화로 확인해주세요.", "group": "예약·방문"}, {"category": "대기시간", "question": "얼마나 기다려야 해요? / 대기시간 있나요?", "answer": "[입력 필요] 평균 대기시간(특히 주말/성수기 기준)을 알려주세요.", "group": "예약·방문"}, {"category": "혼잡시기", "question": "언제 제일 붐벼요? / 시험기간에도 붐비나요?", "answer": "[입력 필요] 성수기(졸업시즌·개강초·시험기간 등) 혼잡 안내와 여유로운 방문 시간대를 알려주세요.", "group": "예약·방문"}, {"category": "노쇼정책", "question": "예약하고 못 가면 어떻게 되나요? / 노쇼 페널티 있나요?", "answer": "예약 시간보다 10분 이상 늦으실 경우 다음 예약 고객을 위해 촬영이 밀리거나 취소될 수 있어요. 늦으실 것 같으면 미리 연락 부탁드려요!", "group": "예약·방문"}, {"category": "빠른촬영", "question": "급하게 지금 바로 찍고 갈 수 있나요? / 대기 없이 바로 촬영 가능해요?", "answer": "네, 당일 스케줄에 여유가 있으면 워크인으로도 촬영이 가능해요! 방문 전 전화로 잔여 타임을 확인해주시면 더 정확해요.", "group": "예약·방문"}, {"category": "소요시간", "question": "촬영하는데 얼마나 걸려요? / 촬영 시간이 얼마나 걸리나요?", "answer": "[입력 필요] 촬영 소요시간: 약 00분 정도 소요됩니다.\n(촬영 종류별로 다르면 구분해서 적어주세요)", "group": "기타"}, {"category": "복장/헤어메이크업", "question": "촬영 전에 준비할 게 있나요? / 옷은 어떻게 입고 가야 하나요? / 메이크업 서비스 있어요?", "answer": "기본적으로 헤어·메이크업은 직접 하고 오시는 걸 권장드려요! 사진관 내 파우더룸에 드라이기, 헤어스프레이, 왁스, 빗, 실핀, 면봉 등이 구비되어 있어 촬영 전 자유롭게 정돈하실 수 있어요.", "group": "의상·준비물"}, {"category": "의상대여", "question": "정장 대여 되나요? / 의상 빌려주나요?", "answer": "실물 정장 대여보다는, 평상복을 입고 오셔도 자연스러운 정장 디지털 합성 보정을 통해 재킷·셔츠·블라우스·넥타이 등을 입은 것처럼 연출해드려요. 원하시는 정장 스타일도 선택하실 수 있어요!", "group": "의상·준비물"}, {"category": "반려동물동반", "question": "반려동물이랑 같이 찍을 수 있나요?", "answer": "네, 반려동물 동반 촬영이 가능합니다! 다만 다른 고객님을 위해 이동장이나 목줄을 지참해주시고, 촬영 전 배변 관리 부탁드려요 🐾", "group": "촬영종류·서류사진"}, {"category": "우천시촬영", "question": "비 오면 야외촬영 어떻게 되나요? / 우천 시 정책", "answer": "[입력 필요] 우천 시 야외촬영 대응(실내 대체촬영/일정변경 등)을 알려주세요.", "group": "촬영종류·서류사진"}, {"category": "편의시설", "question": "대기 공간 있어요? / 화장실 이용 가능한가요? / 유모차 들어가나요?", "answer": "[입력 필요] 대기 공간, 화장실, 유모차·휠체어 접근성 등 편의시설을 알려주세요.", "group": "영업정보"}, {"category": "장애인접근성", "question": "휠체어로 들어갈 수 있나요? / 몸이 불편한데 도와주시나요?", "answer": "[입력 필요] 휠체어 접근성 및 거동이 불편하신 분에 대한 배려 서비스를 알려주세요.", "group": "영업정보"}, {"category": "수령방법", "question": "사진은 언제 받을 수 있어요? / 파일로도 주나요? / 원본 파일 주나요?", "answer": "일반 증명사진은 촬영 후 보정을 거쳐 약 15~30분 내 현장에서 바로 받아보실 수 있어요(작업량에 따라 다소 소요될 수 있어요).\n디지털 파일은 보정본 3,000원, 촬영원본 10,000원에 이메일로 전송해드리며, 현장 수령이 어려우신 분은 우편·택배(배송비 별도)로도 받아보실 수 있어요!", "group": "보정·인화·수령"}, {"category": "수령-매수", "question": "인화는 몇 장 주나요? / 기본 제공 매수", "answer": "기본 제공 인화 매수는 6장입니다 (기본 증명/여권사진 기준).", "group": "보정·인화·수령"}, {"category": "파일형식", "question": "파일은 어떤 형식으로 줘요? / 고화질 파일 받을 수 있나요?", "answer": "제공 파일 형식(JPG/PDF 등)과 해상도300DPI.", "group": "보정·인화·수령"}, {"category": "재수정요청", "question": "사진 톤이나 잡티 다시 수정해줄 수 있나요? / 보정 재요청", "answer": "네, 인화 전에는 만족하실 때까지 수정을 도와드려요! 인화 후 아쉬운 부분을 발견하셨다면, 빠른 시일 내(당일 권장)로 연락 주시면 재수정을 도와드릴게요.", "group": "보정·인화·수령"}, {"category": "재촬영/환불", "question": "마음에 안 들면 재촬영이나 환불 되나요? / 사진이 마음에 안 들어요", "answer": "사진을 인화하기 전이라면 만족하실 때까지 재촬영·수정을 도와드리고 있어요. 인화 이후의 환불 규정은 별도 확인이 필요해요.", "group": "보정·인화·수령"}, {"category": "데이터보관", "question": "예전에 찍은 사진 다시 받을 수 있나요? / 재발급 가능해요?", "answer": "고객님의 사진 데이터는 촬영일로부터 기본 6개월~1년간 안전하게 보관돼요. 이 기간 내에는 언제든 추가 인화가 가능합니다!", "group": "보정·인화·수령"}, {"category": "불만접수", "question": "촬영이 마음에 안 들어서 항의하고 싶어요 / 불편사항 접수", "answer": "불편을 드려 죄송합니다 🙏\n담당자가 직접 확인 후 연락드릴 수 있도록 전화(0507-1320-1427) 또는 아래 채팅으로 자세한 상황을 남겨주세요.", "group": "상담·문의"}, {"category": "주차", "question": "주차 가능한가요? / 차 가지고 가도 돼요? / 주차장 있어요?", "answer": "네, 정문을 통과하여 우회전하시면 나오는 주차장을 이용하실 수 있어요! 만차 시 사진관으로 연락 주시면 안내해드릴게요 🚗", "group": "영업정보"}, {"category": "이벤트/프로모션", "question": "지금 진행하는 이벤트 있나요? / 할인 프로모션", "answer": "[입력 필요] 진행 중인 이벤트·프로모션이 있다면 내용을 알려주세요. 없다면 '현재 진행 중인 이벤트는 없습니다'로 안내할게요.", "group": "가격·결제·이벤트"}, {"category": "지점여부", "question": "다른 지점도 있나요? / 여기가 본점인가요?", "answer": "지점 유무를 알려주세요. 단일 매장이면 '한밭대사진관은 이곳 한 곳에서만 운영하고 있습니다'로 안내할게요.", "group": "영업정보"}, {"category": "개인정보", "question": "제 사진이나 정보는 어떻게 보관되나요? / 개인정보 안전한가요?", "answer": "고객님의 사진과 개인정보는 안전하게 보관되며, 동의 없이 외부에 사용되지 않습니다.\n 상세 보관기간·파기 정책이 있다면 추가해주세요.", "group": "사진관소개"}, {"category": "사진용도확인", "question": "제 사진 광고에 쓰이는 거 아니죠?", "answer": "네, 고객님 동의 없이 촬영하신 사진을 광고나 홍보에 사용하지 않습니다. 안심하고 촬영하세요 😊", "group": "기타"}, {"category": "상담연결", "question": "상담원과 직접 통화하고 싶어요 / 사람이랑 얘기하고 싶어요", "answer": "네, 바로 연결해드릴게요!\n📞 0507-1320-1427 로 전화 부탁드립니다.\n영업시간: 평일 09:30~19:00 / 토·일요일 11:00~18:00", "group": "상담·문의"}, {"category": "칭찬/후기", "question": "여기 사진 잘 나와요? / 후기 궁금해요", "answer": "감사한 말씀이 많은 사진관이에요! 방문하신 고객님들이 보정 퀄리티와 친절한 상담에 만족해주셨어요 😊\n네이버 플레이스에서 실제 후기도 확인하실 수 있어요.", "group": "상담·문의"}, {"category": "전문분야소개", "question": "여기 사진관은 뭘 제일 잘해요? / 전문 분야가 뭐예요?", "answer": "저희 한밭대사진관은 특히 인물사진·여권사진·운전면허사진을 전문으로 촬영하고 있어요! 규격에 딱 맞으면서도 자연스럽게 나오는 사진으로 많은 고객님들이 찾아주고 계세요 😊", "group": "사진관소개"}, {"category": "폴백", "question": "(챗봇이 이해하지 못한 질문)", "answer": "죄송해요, 정확히 이해하지 못했어요 🙏\n아래 중에서 선택해주시거나, 전화(0507-1320-1427)로 문의해주세요.\n\n1️⃣ 촬영 종류\n2️⃣ 가격\n3️⃣ 영업시간·위치\n4️⃣ 예약", "group": "상담·문의"}, {"category": "종료", "question": "고마워요 / 감사합니다 / 끝 / 아니요 괜찮아요", "answer": "네, 감사합니다! 😊\n추가로 궁금하신 점 있으면 언제든 다시 문의해주세요.\n한밭대사진관에서 좋은 사진 남기시길 바랄게요!", "group": "상담·문의"}, {"category": "인물사진-단체증명", "question": "가족 여러 명 각자 증명사진 같이 찍을 수 있나요?", "answer": "여러 명이 한 번에 방문해 각자 증명사진 찍을 때 대기·순번 처리 방식은 네이버 예약 우선입니다.", "group": "촬영종류·서류사진"}, {"category": "여권운전면허공통", "question": "여권사진이랑 운전면허사진 둘 다 같이 찍어도 되나요?", "answer": "네, 한 번 방문하셔서 여권사진·운전면허사진 등 여러 종류를 함께 촬영하실 수 있어요!\n여러 종류 동시 촬영 시 할인 여부가 있다면 가능 합니다.", "group": "촬영종류·서류사진"}, {"category": "서류사진-국제운전면허", "question": "국제운전면허증 사진도 여기서 찍나요? / 국제면허 신청용 사진", "answer": "국제운전면허증 발급용 규격사진 촬영 가능 합니다.", "group": "촬영종류·서류사진"}, {"category": "서류사진-여행증명서", "question": "여행증명서용 사진도 되나요? / 단수여권 사진", "answer": "[입력 필요] 여행증명서·단수여권 등 특수 여권류 사진 규격 대응 여부를 알려주세요.", "group": "촬영종류·서류사진"}, {"category": "서류사진-영주권", "question": "영주권 신청용 사진 찍을 수 있나요? / 해외이주 서류사진", "answer": "[입력 필요] 영주권·해외이주 신청 서류용 사진 촬영 가능 여부를 알려주세요.", "group": "촬영종류·서류사진"}, {"category": "서류사진-유학비자", "question": "유학비자 사진도 찍어주나요? / 어학연수 비자사진", "answer": "[입력 필요] 유학·어학연수 비자 신청용 사진 규격 대응 가능 여부를 알려주세요.", "group": "촬영종류·서류사진"}, {"category": "서류사진-수능응시원서", "question": "수능 응시원서 사진 찍을 수 있나요? / 대학수학능력시험 사진", "answer": "[입력 필요] 수능 응시원서용 규격사진 촬영 가능 여부를 알려주세요.", "group": "촬영종류·서류사진"}, {"category": "서류사진-공무원증", "question": "공무원증 사진 찍을 수 있나요?", "answer": "[입력 필요] 공무원증용 규격사진 촬영 가능 여부를 알려주세요.", "group": "촬영종류·서류사진"}, {"category": "서류사진-보건증", "question": "보건증(보건소 건강진단결과서) 사진도 찍나요?", "answer": "[입력 필요] 보건증 발급용 규격사진 촬영 가능 여부를 알려주세요.", "group": "촬영종류·서류사진"}, {"category": "서류사진-장애인주차증", "question": "장애인 주차표지 신청용 사진 찍을 수 있나요?", "answer": "[입력 필요] 장애인 주차표지(스티커) 신청용 사진 촬영 가능 여부를 알려주세요.", "group": "영업정보"}, {"category": "서류사진-총포소지허가", "question": "총포/수렵면허 신청용 사진 찍을 수 있나요?", "answer": "[입력 필요] 총포소지허가·수렵면허 등 특수 허가증 사진 규격 대응 여부를 알려주세요.", "group": "촬영종류·서류사진"}, {"category": "서류사진-선원수첩", "question": "선원수첩용 사진도 찍어주시나요?", "answer": "[입력 필요] 선원수첩 등 특수 신분증류 사진 규격 대응 여부를 알려주세요.", "group": "촬영종류·서류사진"}, {"category": "서류사진-국가유공자", "question": "국가유공자증 재발급용 사진 찍을 수 있나요?", "answer": "[입력 필요] 국가유공자증 등 재발급 서류용 사진 로 알려져 있어요. 한 번 방문해보시면 차이를 느끼실 거예요 😊", "group": "사진관소개"}, {"category": "가격비교문의", "question": "다른 곳보다 비싼가요 싼가요?", "answer": "가격은 촬영 종류·구성에 따라 다양해요. 정확한 견적은 전화(0507-1320-1427)나 방문 상담으로 안내드릴게요!", "group": "가격·결제·이벤트"}, {"category": "연령제한", "question": "나이 제한 있나요? 어르신도 촬영 가능한가요?", "answer": "네, 연령 제한 없이 누구나 촬영 가능합니다! 어린 아기부터 어르신까지 모두 환영이에요 😊", "group": "사진관소개"}, {"category": "사진관운영자변경", "question": "예전 사장님이랑 다른 분이세요? / 사진관 인수했나요?", "answer": "[입력 필요] 운영자 변경 이력이 있다면 안내 문구를 알려주세요. 없으면 이 항목은 삭제하셔도 됩니다.", "group": "사진관소개"}, {"category": "영어문의가능", "question": "영어로 문의해도 답변 가능한가요? / Do you speak English?", "answer": "[입력 필요] 영어 응대 가능 여부를 알려주세요. (Please let us know if English support is available.)", "group": "상담·문의"}, {"category": "중국어문의가능", "question": "중국어로 문의 가능한가요? / 你好，可以用中文咨询吗？", "answer": "[입력 필요] 중국어 응대 가능 여부를 알려주세요.", "group": "상담·문의"}, {"category": "특수복장촬영", "question": "군복이나 유니폼 입고 촬영해도 되나요?", "answer": "[입력 필요] 특수 복장(군복, 유니폼 등) 착용 촬영 가능 여부를 알려주세요.", "group": "의상·준비물"}, {"category": "종교적복장", "question": "히잡이나 종교적 복장 착용하고 여권사진 찍어도 되나요?", "answer": "[입력 필요] 종교적 복장 착용 시 여권사진 규정(얼굴 노출 기준 등)을 알려주세요.", "group": "의상·준비물"}, {"category": "장기간미방문할인", "question": "오랜만에 왔는데 뭐 혜택 있나요?", "answer": "[입력 필요] 장기 미방문 고객 대상 웰컴백 혜택이 있다면 알려주세요.", "group": "가격·결제·이벤트"}, {"category": "촬영후검수", "question": "사진 찍고 바로 확인시켜주시나요? / 마음에 안 들면 그 자리에서 말할 수 있나요?", "answer": "네! 촬영 후 바로 화면으로 확인시켜드리고, 마음에 안 드시면 그 자리에서 다시 찍어드려요 😊\n[입력 필요] 재촬영 가능 횟수 제한이 있다면 알려주세요.", "group": "보정·인화·수령"}, {"category": "직원친절문의", "question": "사장님이나 직원분들 친절하세요?", "answer": "네, 편안하게 방문하실 수 있도록 항상 친절하게 안내해드리고 있어요 😊 궁금하신 점 있으면 언제든 편하게 물어보세요!", "group": "상담·문의"}, {"category": "사진관규모", "question": "매장이 큰가요? / 촬영 공간이 넓어요?", "answer": "[입력 필요] 매장 규모, 촬영 공간·대기 공간 소개를 알려주세요.", "group": "영업정보"}, {"category": "냉난방", "question": "여름에 시원한가요? / 겨울에 따뜻해요?", "answer": "네, 냉난방이 잘 되어 있어 사계절 편안하게 촬영하실 수 있어요 😊", "group": "영업정보"}, {"category": "촬영전대기가능", "question": "일찍 도착하면 미리 대기해도 되나요?", "answer": "네, 예약 시간보다 일찍 오셔도 자리가 있으면 미리 촬영해드릴 수 있어요. 다만 const GROUP_ORDER = ["상담·문의","영업정보","예약·방문","촬영종류·서류사진","학위복·졸업","의상·준비물","가격·결제·이벤트","보정·인화·수령","배송","사진관소개","기타"];

const chatEl = document.getElementById('chat');
const catsEl = document.getElementById('cats');
const quickwrapEl = document.getElementById('quickwrap');
const quicklistEl = document.getElementById('quicklist');
const inputEl = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

let frameCounter = 0;
let activeGroup = null;

// ---------- category chips ----------
GROUP_ORDER.forEach(g => {
  const count = FAQ.filter(x => x.group === g).length;
  if(count === 0) return;
  const chip = document.createElement('button');
  chip.className = 'cat-chip';
  chip.type = 'button';
  chip.textContent = g;
  chip.addEventListener('click', () => toggleGroup(g, chip));
  catsEl.appendChild(chip);
});

function toggleGroup(g, chipEl){
  const wasActive = activeGroup === g;
  [...catsEl.children].forEach(c => c.classList.remove('active'));
  if(wasActive){
    activeGroup = null;
    quickwrapEl.classList.remove('open');
    return;
  }
  activeGroup = g;
  chipEl.classList.add('active');
  const items = FAQ.filter(x => x.group === g);
  quicklistEl.innerHTML = '';
  items.forEach(it => {
    const b = document.createElement('button');
    b.className = 'quick-q';
    b.type = 'button';
    b.textContent = it.question.split('/')[0].trim();
    b.addEventListener('click', () => {
      quickwrapEl.classList.remove('open');
      [...catsEl.children].forEach(c => c.classList.remove('active'));
      activeGroup = null;
      askDirect(it);
    });
    quicklistEl.appendChild(b);
  });
  quickwrapEl.classList.add('open');
}

// ---------- matching ----------
function bigrams(str){
  const s = str.replace(/\s+/g,'');
  const set = new Set();
  for(let i=0;i<s.length-1;i++) set.add(s.substr(i,2));
  if(set.size === 0 && s.length) set.add(s);
  return set;
}
function overlapScore(a, b){
  const A = bigrams(a), B = bigrams(b);
  if(A.size === 0 || B.size === 0) return 0;
  let inter = 0;
  A.forEach(g => { if(B.has(g)) inter++; });
  return inter / Math.min(A.size, B.size);
}
function findMatches(query){
  const scored = FAQ.map(item => {
    const qScore = overlapScore(query, item.question) * 1.0;
    const cScore = overlapScore(query, item.category) * 0.5;
    const aScore = overlapScore(query, item.answer) * 0.25;
    return {item, score: qScore + cScore + aScore};
  });
  scored.sort((x,y) => y.score - x.score);
  return scored;
}

// ---------- rendering ----------
function scrollToBottom(){
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addUserBubble(text){
  const wrap = document.createElement('div');
  wrap.className = 'msg user';
  const b = document.createElement('div');
  b.className = 'bubble-user';
  b.textContent = text;
  wrap.appendChild(b);
  chatEl.appendChild(wrap);
  scrollToBottom();
}

function addTyping(){
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  wrap.id = 'typingIndicator';
  const t = document.createElement('div');
  t.className = 'typing';
  t.innerHTML = '<span></span><span></span><span></span>';
  wrap.appendChild(t);
  chatEl.appendChild(wrap);
  scrollToBottom();
}
function removeTyping(){
  const el = document.getElementById('typingIndicator');
  if(el) el.remove();
}

function addBotFrame(item, opts){
  opts = opts || {};
  frameCounter++;
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  const frame = document.createElement('div');
  frame.className = 'frame';
  frame.setAttribute('data-no', 'No. ' + String(frameCounter).padStart(3,'0'));

  if(item){
    const cat = document.createElement('p');
    cat.className = 'frame-cat';
    cat.textContent = item.category;
    frame.appendChild(cat);
  }

  const body = document.createElement('div');
  body.className = 'frame-body';
  let answer = item ? item.answer : opts.text;
  const hasPlaceholder = answer.includes('[입력 필요]') || answer.includes('확인 필요');
  answer = answer.replace(/\[입력 필요\]\s*/g, '');
  body.textContent = answer;
  frame.appendChild(body);

  if(hasPlaceholder){
    const note = document.createElement('div');
    note.className = 'frame-note';
    note.textContent = '※ 이 항목은 사장님 확인 전이라 답변이 정확하지 않을 수 있어요. 정확한 안내는 전화 0507-1320-1427 로 문의해주세요.';
    frame.appendChild(note);
  }

  if(opts.suggestions && opts.suggestions.length){
    const row = document.createElement('div');
    row.className = 'suggest-row';
    opts.suggestions.forEach(s => {
      const chip = document.createElement('button');
      chip.className = 'suggest-chip';
      chip.type = 'button';
      chip.textContent = s.question.split('/')[0].trim();
      chip.addEventListener('click', () => askDirect(s));
      row.appendChild(chip);
    });
    frame.appendChild(row);
  }

  wrap.appendChild(frame);
  chatEl.appendChild(wrap);
  scrollToBottom();
}

function askDirect(item){
  addUserBubble(item.question.split('/')[0].trim());
  addTyping();
  setTimeout(() => {
    removeTyping();
    addBotFrame(item);
  }, 380);
}

function handleUserQuery(text){
  addUserBubble(text);
  addTyping();
  setTimeout(() => {
    removeTyping();
    const results = findMatches(text);
    const top = results[0];
    if(top && top.score >= 0.28){
      addBotFrame(top.item);
    } else {
      const suggestions = results.slice(0,3).map(r => r.item);
      addBotFrame(null, {
        text: '정확히 어떤 내용인지 잘 못 찾았어요 🙏\n아래 질문 중에 비슷한 게 있는지 확인해보시거나, 전화(0507-1320-1427)로 문의해주세요!',
        suggestions
      });
    }
  }, 480);
}

sendBtn.addEventListener('click', () => {
  const v = inputEl.value.trim();
  if(!v) return;
  inputEl.value = '';
  handleUserQuery(v);
});
inputEl.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){
    e.preventDefault();
    sendBtn.click();
  }
});

// ---------- greeting ----------
const greet = FAQ.find(x => x.category === '인사말');
if(greet){
  addBotFrame(greet);
} else {
  addBotFrame(null, {text:'안녕하세요! 한밭대사진관 챗봇입니다 😊 무엇을 도와드릴까요?'});
}
